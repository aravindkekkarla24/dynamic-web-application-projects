<DOCTYPE!>
<html>
    <head>
        <title>Click-counter-application</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class = "bg-container">
            <h1 class = "heading">Counter</h1>
            <p id = "counterValue" class ="para">0</p>
            <button onclick = "decreaseCounterValue()" id = "decreaseBtn">Decrease</button>
            <button onclick = "resetCounterValue()"  id = "resetBtn">Reset</button>
            <button onclick ="increaseCounterValue()" id = "increaseBtn">Increase</button>
        </div>
       
        <script src="index.js"></script>
    </body>
</html>
