<!DOCTYPE html>
<html>
    <head>
        <title>Image Manipulation</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>

        <div class = "bg-container">
            <div class = "image-container">
                <img src ="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/bulb-go-on-img.png" class ="bulb-image" id = "bulb"/>
                <img src ="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/cat-img.png" class ="cat-image" id ="cat"/>
            </div>


            <div class = "switch-container">
                <h1>Switched <span id="spanId">OFF</span></h1>
                <button class = "button" id ="offBtn" onclick = "switchOFF()">OFF</button>
                <button class = "button" id ="onBtn"   onclick = "switchON()">ON</button>
                
            </div>


        </div>
        <script src="index.js"></script>
    </body>
</html>
