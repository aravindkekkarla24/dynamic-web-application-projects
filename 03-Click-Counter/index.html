<!DOCTYPE html>
<html>
    <head>
        <title>Click Counter Application</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>

        <div class="bg-container">
            <div class = "counter-container">
                <h1 class = "heading">Counter</h1>
                <p ><span  class ="counter" id = "counterValue">0</span></p>
                <div>
                    <button onclick = "decrement()" id = "decreaseBtn">Decrement</button>
                    <button onclick = "reset()" id = "resetBtn">Reset</button>
                    <button onclick = "increment()" id = "increaseBtn">Increment</button>
                </div>
                
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
