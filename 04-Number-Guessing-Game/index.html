<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class = "bg-container">
        <div class = "card-container">
            <h1>Guess The Number</h1>
            <p id ="counterValue">0</p>
            <input id ="inputNumber" type = "number" placeholder = "Enter the number..."/>

            <p>Welcome! press generate number button to start game</p>
            <div>
                <button onclick = "generateNumber()" id = "startBtn">Generate Number</button>
                <button onclick = "checkNumber()" id = "validateBtn">Validate Number</button>
                <button>Restart</button>
            </div>
        </div>
    </div>
    

    <script src="index.js"></script>
</body>
</html>
